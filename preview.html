<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video to Clips — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: { extend: {} }
    };
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <main class="max-w-3xl mx-auto px-4 py-10" id="app"></main>

  <script>
    // ─── State ───
    let currentPage = "home"; // "home" | "job"
    let mode = "file";        // "file" | "url"
    let fileName = null;
    let jobStatus = null;

    // ─── Render helpers ───
    function render() {
      const app = document.getElementById("app");
      if (currentPage === "home") {
        app.innerHTML = renderHome();
      } else if (currentPage === "job") {
        app.innerHTML = renderJob();
      }
      attachHandlers();
    }

    function renderHome() {
      return `
        <h1 class="text-3xl font-bold mb-2">Video to Clips</h1>
        <p class="text-gray-400 mb-8">Upload a video or paste a YouTube URL to extract the best clips.</p>
        <form id="uploadForm" class="space-y-6">
          <div class="flex gap-2">
            <button type="button" data-mode="file"
              class="px-4 py-2 rounded text-sm font-medium transition ${mode === 'file' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-gray-200'}">
              Upload File
            </button>
            <button type="button" data-mode="url"
              class="px-4 py-2 rounded text-sm font-medium transition ${mode === 'url' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-gray-200'}">
              YouTube URL
            </button>
          </div>

          ${mode === 'file' ? `
            <div id="dropZone"
              class="border-2 border-dashed border-gray-700 rounded-lg p-8 text-center cursor-pointer hover:border-gray-500 transition">
              <input type="file" accept="video/*" class="hidden" id="fileInput" />
              <p class="${fileName ? 'text-gray-200' : 'text-gray-500'}">
                ${fileName || 'Click to select a video file (mp4, mov, etc.)'}
              </p>
            </div>
          ` : `
            <input type="url" placeholder="https://www.youtube.com/watch?v=..."
              class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500" />
          `}

          <button type="submit"
            class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition">
            Extract Clips
          </button>
        </form>
      `;
    }

    function renderJob() {
      const steps = [
        { key: "downloading", label: "Downloading video..." },
        { key: "transcribing", label: "Transcribing audio with Whisper..." },
        { key: "analyzing", label: "Analyzing transcript, selecting best segments..." },
        { key: "rendering", label: "Cutting clips with ffmpeg..." },
        { key: "generating_metadata", label: "Generating titles and hashtags..." },
        { key: "completed", label: "Done! Your clips are ready." },
      ];
      const currentIdx = steps.findIndex(s => s.key === jobStatus);
      const progress = jobStatus === "completed" ? 100 : Math.round((currentIdx / (steps.length - 1)) * 100);
      const barColor = jobStatus === "completed" ? "bg-green-500" : "bg-blue-500";

      const sampleClips = [
        {
          index: 1, start: "0:15", end: "0:48", duration: "33.0",
          title: "The Secret Behind Viral Content",
          caption: "Breaking down the key elements that make content go viral on social media.",
          hashtags: ["#viral", "#contentcreator", "#socialmedia", "#tips"],
          score: 92
        },
        {
          index: 2, start: "2:10", end: "2:55", duration: "45.0",
          title: "Why Most Creators Fail",
          caption: "The number one mistake new creators make and how to avoid it.",
          hashtags: ["#creator", "#growthhacks", "#youtube", "#advice"],
          score: 87
        },
        {
          index: 3, start: "5:30", end: "6:02", duration: "32.0",
          title: "Algorithm Hack Nobody Talks About",
          caption: "A simple trick to boost your reach that most people overlook.",
          hashtags: ["#algorithm", "#hack", "#reach", "#growth"],
          score: 81
        },
      ];

      let clipsHtml = "";
      if (jobStatus === "completed") {
        clipsHtml = `
          <div class="space-y-4">
            <h2 class="text-xl font-semibold">${sampleClips.length} Clips Extracted</h2>
            ${sampleClips.map(c => `
              <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
                <div class="w-full aspect-video bg-black flex items-center justify-center">
                  <svg class="w-16 h-16 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div class="p-4 space-y-3">
                  <h3 class="font-semibold text-gray-100">${c.title}</h3>
                  <p class="text-gray-400 text-sm">${c.caption}</p>
                  <div class="flex items-center justify-between text-sm">
                    <span class="font-medium text-gray-300">Clip ${c.index}</span>
                    <span class="text-gray-500">${c.start} – ${c.end} (${c.duration}s)</span>
                    <span class="text-blue-400 font-mono text-xs">score: ${c.score}</span>
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${c.hashtags.map(t => `<span class="text-xs bg-gray-800 text-blue-300 px-2 py-0.5 rounded">${t}</span>`).join("")}
                  </div>
                  <div class="flex gap-3 pt-1">
                    <a href="#" class="text-sm text-blue-400 hover:text-blue-300 underline">Download MP4</a>
                    <a href="#" class="text-sm text-blue-400 hover:text-blue-300 underline">Download SRT</a>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      return `
        <a href="#" id="backLink" class="text-sm text-blue-400 hover:text-blue-300 mb-4 inline-block">&larr; Back</a>
        <div class="space-y-6">
          <div>
            <p class="text-sm text-gray-500 mb-1">sample_video.mp4</p>
            <p class="text-lg font-medium">${steps[currentIdx]?.label || "Processing..."}</p>
          </div>
          <div class="w-full bg-gray-800 rounded-full h-2">
            <div class="${barColor} h-2 rounded-full transition-all duration-500" style="width:${progress}%"></div>
          </div>
          ${jobStatus !== "completed" ? `<p class="text-gray-500 text-sm">Click "Next Step" to simulate progress.</p>
          <button id="nextStep" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-sm transition">Next Step &rarr;</button>` : ""}
          ${clipsHtml}
        </div>
      `;
    }

    // ─── Event handlers ───
    function attachHandlers() {
      // Mode toggle
      document.querySelectorAll("[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          mode = btn.dataset.mode;
          render();
        });
      });

      // File drop zone
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      if (dropZone && fileInput) {
        dropZone.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", (e) => {
          fileName = e.target.files?.[0]?.name || null;
          render();
        });
      }

      // Form submit → go to job page
      const form = document.getElementById("uploadForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          currentPage = "job";
          jobStatus = "downloading";
          render();
        });
      }

      // Next step button
      const nextBtn = document.getElementById("nextStep");
      if (nextBtn) {
        const order = ["downloading","transcribing","analyzing","rendering","generating_metadata","completed"];
        nextBtn.addEventListener("click", () => {
          const idx = order.indexOf(jobStatus);
          if (idx < order.length - 1) {
            jobStatus = order[idx + 1];
            render();
          }
        });
      }

      // Back link
      const back = document.getElementById("backLink");
      if (back) {
        back.addEventListener("click", (e) => {
          e.preventDefault();
          currentPage = "home";
          jobStatus = null;
          render();
        });
      }
    }

    // ─── Init ───
    render();
  </script>
</body>
</html>
